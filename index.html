<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً | إعلان التشويقية لحلقات فلق ٢</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            /* خلفية داكنة جداً (أسود متدرج) لكي يبرز الشعار الأزرق بوضوح */
            background: linear-gradient(135deg, #050505, #121212, #1a1a1a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            /* إزالة الصندوق المزعج ليكون التصميم عصري ومفتوح */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .logo {
            /* تكبير الشعار ليغطي أغلب الموقع */
            width: 90%;
            max-width: 600px; 
            height: auto;
            object-fit: contain;
            margin-bottom: 30px;
            /* إضافة ظل ناعم للشعار ليعطيه عمقاً */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: transform 0.5s ease;
        }

        .logo:hover {
            transform: scale(1.02); /* تفاعل بسيط عند مرور الماوس على الشعار */
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-weight: 900;
            letter-spacing: -1px;
            color: #f8f9fa;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: #868e96; /* لون رمادي عصري ومريح للعين */
            font-weight: 400;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            direction: ltr;
            width: 100%;
        }

        .time-box {
            /* تصميم عصري للعداد: زجاجي خفيف جداً */
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 15px;
            border-radius: 16px;
            min-width: 90px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        /* حركة ارتفاع الماوس على مربعات الوقت */
        .time-box:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .time-box span {
            display: block;
            font-size: 3.5rem; /* أرقام ضخمة وعصرية */
            font-weight: 900;
            line-height: 1;
            background: -webkit-linear-gradient(#fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .time-box .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            color: #6c757d;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .countdown { gap: 10px; flex-wrap: wrap; }
            .time-box { min-width: 75px; padding: 15px 10px; }
            .time-box span { font-size: 2.5rem; }
            h1 { font-size: 1.8rem; }
            .logo { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png.jpg" alt="شعار فلق ٢" class="logo">
        
        <h1>إعلان التشويقية لحلقات فلق ٢</h1>
        <p>ترقبوا الإعلان التشويقي للحلقات القادمة، كونوا في الموعد!</p>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">يوم</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">ساعة</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">دقيقة</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">ثانية</div>
            </div>
        </div>
    </div>

    <script>
        // تم ضبط العداد ليظهر: 1 يوم و 16 ساعة 
        const launchDate = new Date("2026-06-06T22:28:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h2 style='font-size:2.5rem; font-weight:900;'>تم إطلاق الإعلان!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
