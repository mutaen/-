<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً | إعلان التشويقية لحلقات فلق ٢</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            /* خلفية داكنة جداً (أسود متدرج) لكي يبرز الشعار الأزرق بوضوح */
            background: linear-gradient(135deg, #050505, #121212, #1a1a1a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
        }

        .logo {
            max-width: 180px; /* حجم الشعار */
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            direction: ltr;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 80px;
            /* إضافة التأثير التفاعلي البسيط هنا */
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: default;
        }

        /* حركة ارتفاع الماوس على مربعات الوقت */
        .time-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .time-box .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #b0bec5;
        }

        @media (max-width: 600px) {
            .countdown { flex-wrap: wrap; }
            .time-box { min-width: 60px; padding: 10px; }
            .time-box span { font-size: 2rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="شعار فلق ٢" class="logo">
        
        <h1>إعلان التشويقية لحلقات فلق ٢</h1>
        <p>ترقبوا الإعلان التشويقي للحلقات القادمة، كونوا في الموعد!</p>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">يوم</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">ساعة</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">دقيقة</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">ثانية</div>
            </div>
        </div>
    </div>

    <script>
        // تم ضبط العداد ليظهر: 1 يوم و 16 ساعة 
        const launchDate = new Date("2026-06-06T22:28:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h2>تم إطلاق الإعلان!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
