<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلق ٢ | قريباً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات ونظام الألوان --- */
        :root {
            --primary-blue: #007bff; /* لون التشويق الأزرق */
            --bg-dark: #121212;      /* خلفية داكنة جداً للوضوح */
            --glass-bg: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff;
            --text-muted: #b0bec5;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            
            /* --- 1. الخلفية التفاعلية المتحركة --- */
            background: linear-gradient(-45deg, #1a1a1a, #0d0d0d, #1a1a1a, #000a12);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* تحريك الخلفية */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. صندوق المعلومات التفاعلي (Glassmorphism) --- */
        .main-container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 70px;
            border-radius: 30px;
            max-width: 90%;
            width: 650px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            
            /* --- نبض الحافة الداكن --- */
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: pulseBorder 3s infinite;
        }

        @keyframes pulseBorder {
            0% { border-color: rgba(255, 255, 255, 0.05); }
            50% { border-color: rgba(0, 123, 255, 0.2); }
            100% { border-color: rgba(255, 255, 255, 0.05); }
        }

        /* --- الشعار --- */
        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 25px;
            /* للتأكد من أن الشعار يبرز بوضوح حتى لو كان داكناً قليلاً */
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        .project-highlight {
            color: var(--primary-blue); /* تمييز اسم المشروع باللون الأزرق */
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* --- 3. عداد الوقت تفاعلي ومرتب --- */
        .countdown-frame {
            display: flex;
            justify-content: center;
            gap: 20px;
            direction: ltr; /* لترتيب الأرقام عالمياً */
        }

        .time-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px 10px;
            border-radius: 15px;
            min-width: 100px;
            border: 1px solid
