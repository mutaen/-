<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً | اسم مشروعك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* خلفية متدرجة أنيقة */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
        }

        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            direction: ltr; /* لضمان عرض الأرقام بشكل صحيح */
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 80px;
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .time-box .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #b0bec5;
        }

        /* تعديلات للجوال */
        @media (max-width: 600px) {
            .countdown {
                flex-wrap: wrap;
            }
            .time-box {
                min-width: 60px;
                padding: 10px;
            }
            .time-box span {
                font-size: 2rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="شعار المشروع" class="logo">
        
        <h1>اسم مشروعك هنا</h1>
        <p>شيء عظيم في الطريق إليكم... نحن نعمل بشغف لإطلاق شيء استثنائي، كونوا بالقرب!</p>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">يوم</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">ساعة</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">دقيقة</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">ثانية</div>
            </div>
        </div>
    </div>

    <script>
        // حدد تاريخ الإطلاق هنا (السنة، الشهر - 1، اليوم، الساعة، الدقيقة)
        // ملاحظة: الأشهر تبدأ من 0 (يعني يناير = 0، فبراير = 1، وهكذا)
        // مثال: 1 سبتمبر 2026 الساعة 00:00
        const launchDate = new Date(2026, 8, 1, 0, 0, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            // حساب الوقت المتبقي
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // عرض النتيجة مع إضافة صفر إذا كان الرقم أقل من 10
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // إذا انتهى العداد
            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h2>لقد انطلقنا!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
